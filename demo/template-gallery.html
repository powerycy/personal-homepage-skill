<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage Template Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&family=Condiment&family=Cormorant+Garamond:wght@700&family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    /* === BASE === */
    :root {
      --bg: #0b0b0f;
      --ink: #f8f4ec;
      --muted: rgba(248, 244, 236, 0.68);
      --line: rgba(255, 255, 255, 0.12);
      --card: rgba(255, 255, 255, 0.055);
      --paper: #f7f3ea;
      font-family: "Inter", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 10% 0%, rgba(129, 92, 255, 0.22), transparent 32%),
        radial-gradient(circle at 90% 10%, rgba(255, 184, 106, 0.14), transparent 30%),
        linear-gradient(180deg, #0b0b0f 0%, #14131a 50%, #0b0b0f 100%);
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* === PAGE SHELL === */
    .page {
      width: min(1500px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 52px;
    }

    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: var(--card);
      box-shadow: 0 34px 120px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(22px);
    }

    .hero {
      position: relative;
      isolation: isolate;
      padding: clamp(28px, 4vw, 54px);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.14), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(115, 66, 226, 0.28), transparent 24%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr minmax(260px, 360px);
      gap: 34px;
      align-items: end;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 15px;
      color: rgba(255, 255, 255, 0.72);
      font: 800 12px/1 "JetBrains Mono", monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 930px;
      margin: 0;
      font: 900 clamp(3.1rem, 8vw, 7rem)/0.9 "Archivo", sans-serif;
      letter-spacing: -0.075em;
    }

    .hero p {
      max-width: 760px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.18rem);
      line-height: 1.75;
    }

    .stat-panel {
      display: grid;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.25);
      padding: 18px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .stat-row strong {
      color: #fff;
      font: 800 28px/1 "JetBrains Mono", monospace;
    }

    .note {
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.10);
      padding: 12px;
      font-size: 12px;
      line-height: 1.65;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .filter {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px 16px;
      color: rgba(255, 255, 255, 0.74);
      font-weight: 800;
      transition: border-color 0.22s ease, background 0.22s ease, color 0.22s ease, transform 0.22s ease;
    }

    .filter:hover { transform: translateY(-1px); }

    .filter.active {
      border-color: rgba(255, 255, 255, 0.7);
      background: var(--ink);
      color: #101015;
    }

    /* === CARD GRID === */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      padding: clamp(20px, 2.4vw, 34px);
    }

    .template-card {
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.055);
      padding: 16px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateY(28px);
      animation: card-enter 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .template-card.hidden { display: none; }

    .preview-shell {
      position: relative;
      height: 268px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: #101015;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 24px 60px rgba(0, 0, 0, 0.24);
    }

    .preview-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.45), transparent 80%);
      transform: translateX(-100%);
      animation: preview-shine 4.8s ease-in-out infinite;
      transition: opacity 0.25s ease;
    }

    .template-card:hover .preview-shell::after { opacity: 0.18; }

    .noise {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 18px 18px;
      mix-blend-mode: overlay;
    }

    .card-body { padding: 20px 4px 4px; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .category {
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 0.42);
      font: 800 12px/1 "JetBrains Mono", monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      color: #fff;
      font: 900 25px/0.98 "Archivo", sans-serif;
      letter-spacing: -0.045em;
    }

    .arrow {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      color: var(--accent);
      font-weight: 900;
    }

    .summary {
      min-height: 56px;
      margin: 16px 0 0;
      color: rgba(255, 255, 255, 0.66);
      font-size: 14px;
      line-height: 1.75;
    }

    .best-for {
      margin: 12px 0 0;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.22);
      padding: 10px 12px;
      color: rgba(255, 255, 255, 0.56);
      font-size: 12px;
      line-height: 1.6;
    }

    .effects {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .effect {
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 12px;
    }

    /* === PREVIEW VISUALS === */
    .pv-cinematic { background: #050507; font-family: "Manrope", sans-serif; }
    .pv-cinematic .bg { position: absolute; inset: 0; background: radial-gradient(circle at 60% 35%, rgba(255,255,255,.16), transparent 20%), linear-gradient(130deg, #050507, #181821 55%, #050507); }
    .pv-cinematic .label { position: absolute; left: 20px; top: 20px; font: 700 10px/1 "JetBrains Mono"; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.5); }
    .pv-cinematic .title { position: absolute; bottom: 24px; left: 20px; max-width: 52%; font-size: 31px; font-weight: 900; line-height: .92; letter-spacing: -.06em; }
    .pv-cinematic p { position: absolute; bottom: 22px; left: 20px; max-width: 52%; margin: 0; transform: translateY(60px); font-size: 12px; line-height: 1.6; color: rgba(255,255,255,.56); }
    .pv-cinematic .cta { position: absolute; right: 20px; bottom: 20px; width: 92px; height: 92px; border: 1px solid rgba(255,255,255,.14); border-radius: 26px; background: rgba(255,255,255,.1); backdrop-filter: blur(18px); }

    .pv-soft { background: #cfc8c5; color: #192837; }
    .pv-soft .bg { position: absolute; inset: 0; background: radial-gradient(circle at 45% 65%, rgba(255,255,255,.58), transparent 28%), linear-gradient(135deg, #d7d0ca, #aab3b3); }
    .pv-soft .nav { position: absolute; left: 20px; top: 18px; display: flex; gap: 13px; align-items: center; font-size: 12px; font-weight: 900; }
    .pv-soft .pill { position: absolute; right: 20px; top: 18px; border-radius: 999px; background: #7342e2; padding: 10px 15px; color: #fff; font-size: 12px; font-weight: 900; }
    .pv-soft .title { position: absolute; left: 50%; top: 52%; width: 78%; transform: translate(-50%, -50%); text-align: center; font: 900 34px/.98 "Archivo"; letter-spacing: -.055em; }
    .pv-soft p { position: absolute; left: 50%; top: 63%; width: 260px; margin: 0; transform: translateX(-50%); text-align: center; font-size: 12px; line-height: 1.6; opacity: .7; }

    .pv-orbis { background: #010828; color: #eff4ff; }
    .pv-orbis .bg { position: absolute; inset: 0; background: radial-gradient(circle at 58% 28%, rgba(72,104,210,.55), transparent 34%), radial-gradient(circle at 78% 20%, rgba(111,255,0,.12), transparent 24%), linear-gradient(145deg, #010828, #06165a 58%, #010828); }
    .pv-orbis .brand { position: absolute; left: 20px; top: 20px; font: 400 22px/.9 "Anton"; text-transform: uppercase; letter-spacing: .08em; }
    .pv-orbis .nav { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(255,255,255,.04); padding: 11px 25px; font-size: 9px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; backdrop-filter: blur(8px); white-space: nowrap; }
    .pv-orbis .social { position: absolute; right: 20px; top: 20px; display: grid; gap: 8px; }
    .pv-orbis .social div { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.18); border-radius: 16px; background: rgba(255,255,255,.05); backdrop-filter: blur(8px); }
    .pv-orbis .title { position: absolute; left: 24px; top: 86px; max-width: 265px; font: 400 38px/.92 "Anton"; text-transform: uppercase; letter-spacing: .01em; }
    .pv-orbis .script { position: absolute; left: 48%; top: 103px; transform: rotate(-3deg); color: #6fff00; font: 400 31px/1 "Condiment"; opacity: .95; mix-blend-mode: screen; }
    .pv-orbis .score { position: absolute; left: 24px; bottom: 22px; color: rgba(255,255,255,.48); font: 700 10px/1 "JetBrains Mono"; letter-spacing: .15em; text-transform: uppercase; }
    .pv-orbis .bar { position: absolute; left: 24px; bottom: 44px; width: 112px; height: 6px; border-radius: 999px; background: #6fff00; }
    .pv-orbis .cards { position: absolute; right: 24px; bottom: 40px; display: flex; align-items: end; gap: 12px; }
    .pv-orbis .card { width: 80px; height: 96px; border: 1px solid rgba(255,255,255,.18); border-radius: 24px; background: rgba(255,255,255,.045); padding: 8px; backdrop-filter: blur(8px); }
    .pv-orbis .card.big { width: 96px; height: 128px; }
    .pv-orbis .media { height: 100%; border-radius: 18px; background: radial-gradient(circle at 50% 45%, rgba(111,255,0,.32), transparent 40%), #10266c; }

    .pv-toon { background: #f4845f; color: #111; }
    .pv-toon .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.42), transparent 34%), linear-gradient(180deg, rgba(255,255,255,.16), transparent 60%, rgba(0,0,0,.14)); }
    .pv-toon .brand { position: absolute; left: 20px; top: 16px; font: 400 32px/.9 "Anton"; letter-spacing: -.04em; }
    .pv-toon .ghost { position: absolute; left: 50%; top: 45%; width: 120%; transform: translate(-50%, -50%); text-align: center; font: 400 72px/.9 "Anton"; letter-spacing: -.06em; color: rgba(255,255,255,.28); mix-blend-mode: soft-light; }
    .pv-toon .blob { position: absolute; left: 50%; top: 45%; width: 160px; height: 160px; transform: translate(-50%, -50%); border-radius: 42%; background: #f79b7f; opacity: .8; }
    .pv-toon .side-a, .pv-toon .side-b, .pv-toon .center { position: absolute; border-radius: 36px; }
    .pv-toon .side-a { left: 18%; top: 40%; width: 80px; height: 112px; transform: translateY(-50%) rotate(-6deg); background: #6bbf7a; opacity: .72; }
    .pv-toon .side-b { right: 18%; top: 40%; width: 80px; height: 112px; transform: translateY(-50%) rotate(6deg); background: #e882b4; opacity: .72; }
    .pv-toon .center { left: 50%; top: 47%; width: 112px; height: 160px; transform: translate(-50%, -50%); background: linear-gradient(180deg, #fff7e9, #f06b4f); box-shadow: 0 26px 42px rgba(0,0,0,.22); }
    .pv-toon .copy { position: absolute; left: 20px; bottom: 20px; max-width: 230px; font: 400 34px/.86 "Anton"; letter-spacing: -.05em; }
    .pv-toon .discover { position: absolute; right: 20px; bottom: 20px; border-radius: 999px; background: #000; color: #fff; padding: 10px 15px; font-size: 10px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }

    .pv-clean { background: #edf7ff; color: #17212f; }
    .pv-clean .wave { position: absolute; left: -70px; right: -70px; bottom: -68px; height: 180px; border-radius: 50%; background: linear-gradient(90deg, #b7dcff, #f9fbff); transform: rotate(-3deg); }
    .pv-clean .nav { position: absolute; inset: 18px 22px auto; display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; color: rgba(23,33,47,.62); }
    .pv-clean .hello { position: absolute; left: 32px; top: 72px; border-radius: 999px; background: #fff; padding: 8px 14px; font-size: 12px; font-weight: 900; box-shadow: 0 14px 30px rgba(80,140,200,.18); }
    .pv-clean .title { position: absolute; left: 32px; top: 122px; max-width: 260px; font: 900 34px/.96 "Archivo"; letter-spacing: -.055em; }
    .pv-clean .title span { color: #3279ff; }
    .pv-clean .avatar { position: absolute; right: 46px; top: 78px; width: 138px; height: 138px; border-radius: 42% 58% 45% 55%; background: linear-gradient(135deg, #fff, #d7ecff); border: 2px solid rgba(50,121,255,.18); box-shadow: 0 24px 55px rgba(80,140,200,.2); }
    .pv-clean .pill { position: absolute; right: 34px; bottom: 32px; border-radius: 999px; background: #fff; padding: 9px 14px; color: #3279ff; font-size: 12px; font-weight: 900; }

    .pv-tech3d { background: #050d12; }
    .pv-tech3d .bg { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(34,245,200,.16), transparent 38%), radial-gradient(circle at 80% 30%, rgba(34,245,200,.25), transparent 22%); }
    .pv-tech3d .terminal { position: absolute; left: 24px; top: 24px; border: 1px solid rgba(110,231,183,.2); border-radius: 16px; background: rgba(0,0,0,.35); padding: 14px; color: rgba(167,243,208,.84); font: 500 10px/1.7 "JetBrains Mono"; }
    .pv-tech3d .cube { position: absolute; right: 40px; top: 55px; width: 112px; height: 112px; transform: rotate(12deg); border: 1px solid rgba(167,243,208,.3); border-radius: 24px; background: rgba(110,231,183,.1); box-shadow: 0 0 50px rgba(34,245,200,.35); }
    .pv-tech3d .title { position: absolute; left: 24px; bottom: 30px; font: 700 31px/.98 "Space Grotesk"; }

    .pv-gradient { background: #180f2c; }
    .pv-gradient .orb1, .pv-gradient .orb2, .pv-gradient .orb3 { position: absolute; border-radius: 999px; filter: blur(24px); }
    .pv-gradient .orb1 { left: -60px; top: 8px; width: 190px; height: 190px; background: #ff7ac8; }
    .pv-gradient .orb2 { right: 0; top: 24px; width: 176px; height: 176px; background: #5cf4ff; }
    .pv-gradient .orb3 { left: 96px; bottom: -20px; width: 210px; height: 145px; background: #ffe15a; }
    .pv-gradient .chip { position: absolute; left: 24px; top: 28px; border-radius: 999px; background: rgba(255,255,255,.15); padding: 9px 14px; font-size: 12px; font-weight: 900; }
    .pv-gradient .title { position: absolute; left: 24px; bottom: 28px; max-width: 265px; font: 900 38px/.9 "Archivo"; letter-spacing: -.06em; }
    .pv-gradient .icon { position: absolute; right: 24px; bottom: 28px; border-radius: 22px; background: rgba(255,255,255,.18); padding: 18px; }

    .pv-magazine { background: #f4eadb; color: #201610; }
    .pv-magazine .top { position: absolute; left: 20px; right: 20px; top: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,.2); padding-bottom: 8px; font: 700 10px/1 "JetBrains Mono"; letter-spacing: .2em; text-transform: uppercase; }
    .pv-magazine .title { position: absolute; left: 24px; top: 64px; font: 400 52px/.78 "DM Serif Display"; letter-spacing: -.05em; }
    .pv-magazine .image { position: absolute; right: 20px; bottom: 20px; width: 128px; height: 145px; border-radius: 70px 70px 0 0; background: linear-gradient(160deg, #d85135, #f2b08b); }
    .pv-magazine p { position: absolute; left: 24px; bottom: 24px; max-width: 170px; margin: 0; font-size: 12px; line-height: 1.6; }

    .pv-terminal { background: #020503; color: #78ff9f; font-family: "JetBrains Mono"; }
    .pv-terminal .panel { position: absolute; inset: 16px; border: 1px solid rgba(134,239,172,.2); border-radius: 18px; background: rgba(0,0,0,.55); padding: 20px; }
    .pv-terminal .lights { display: flex; gap: 8px; margin-bottom: 18px; }
    .pv-terminal .lights span { width: 10px; height: 10px; border-radius: 50%; }
    .pv-terminal p { margin: 7px 0; font-size: 12px; }
    .pv-terminal .white { color: rgba(255,255,255,.75); }

    .pv-resume { background: #f8f5ed; color: #171717; }
    .pv-resume .title { position: absolute; left: 28px; top: 28px; font: 800 38px/.92 "Fraunces"; letter-spacing: -.05em; }
    .pv-resume .download { position: absolute; right: 24px; top: 28px; border: 1px solid rgba(0,0,0,.15); border-radius: 999px; padding: 10px 14px; font-size: 12px; font-weight: 900; }
    .pv-resume .cards { position: absolute; left: 28px; right: 28px; bottom: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .pv-resume .cards div { height: 66px; border: 1px solid rgba(0,0,0,.1); border-radius: 18px; background: rgba(255,255,255,.7); }

    .pv-pixel { background: #ffe9ef; color: #322231; }
    .pv-pixel .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(#f8bdd0 1px, transparent 1px), linear-gradient(90deg, #f8bdd0 1px, transparent 1px); background-size: 18px 18px; }
    .pv-pixel .avatar { position: absolute; left: 28px; top: 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 80px; height: 80px; }
    .pv-pixel .avatar span { background: #ff8fb4; }
    .pv-pixel .title { position: absolute; left: 28px; bottom: 28px; font: 700 31px/.98 "Space Grotesk"; }
    .pv-pixel .quest { position: absolute; right: 28px; top: 28px; border: 4px solid #322231; border-radius: 16px; background: #fff7b7; padding: 12px 16px; font-size: 12px; font-weight: 900; }

    .pv-dashboard { background: #07111f; font-family: "JetBrains Mono"; }
    .pv-dashboard .chip { position: absolute; left: 24px; top: 24px; border: 1px solid rgba(103,232,249,.2); border-radius: 14px; background: rgba(103,232,249,.1); padding: 12px; color: #cffafe; font-size: 12px; }
    .pv-dashboard .core { position: absolute; left: 50%; top: 50%; display: grid; width: 96px; height: 96px; place-items: center; transform: translate(-50%, -50%); border: 1px solid rgba(165,243,252,.3); border-radius: 50%; background: rgba(103,232,249,.1); color: #cffafe; font-size: 12px; font-weight: 900; box-shadow: 0 0 55px rgba(85,215,255,.35); }
    .pv-dashboard .node { position: absolute; width: 80px; height: 48px; border: 1px solid rgba(165,243,252,.2); border-radius: 14px; background: rgba(255,255,255,.05); }

    .pv-bento { background: #15110a; }
    .pv-bento .layout { position: absolute; inset: 16px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 12px; }
    .pv-bento .main { grid-column: span 2; grid-row: span 2; border-radius: 24px; background: #ffe15a; padding: 16px; color: #000; font: 900 25px/.96 "Archivo"; }
    .pv-bento .tile { border-radius: 24px; background: rgba(255,255,255,.12); padding: 14px; font-size: 13px; }
    .pv-bento .pink { background: #ff7ac8; }
    .pv-bento .cyan { background: #5cf4ff; }
    .pv-bento .wide { grid-column: span 2; }

    .pv-dark { background: #080706; }
    .pv-dark .title { position: absolute; left: 24px; top: 24px; color: #efe4cf; font: 700 52px/.78 "Cormorant Garamond"; }
    .pv-dark .shapes { position: absolute; right: 20px; bottom: 20px; display: flex; gap: 12px; align-items: end; }
    .pv-dark .shapes div:nth-child(1) { width: 80px; height: 145px; border-radius: 999px; background: #d7b46a; }
    .pv-dark .shapes div:nth-child(2) { width: 96px; height: 145px; border-radius: 48px 48px 0 0; background: #46382a; }
    .pv-dark .shapes div:nth-child(3) { width: 64px; height: 145px; border-radius: 999px; background: #efe4cf; }

      if (window.inlineEditor?.isActive) window.inlineEditor.save();
      document.querySelectorAll('.filter').forEach((button) => {
        button.classList.toggle('active', button.textContent === activeCategory);

      grid.innerHTML = '';
      templates
        .filter((template) => activeCategory === 'All' || template.category === activeCategory)

          const node = cardTemplate.content.cloneNode(true);

          const arrow = node.querySelector('.arrow');

          const bestFor = node.querySelector('.best-for');
          const effects = node.querySelector('.effects');

          card.style.setProperty('--accent', template.accent);
          card.style.animationDelay = `${index * 35}ms`;
          card.dataset.category = template.category;
          card.dataset.templateName = template.name;
          preview.replaceWith(htmlToElement(previewHtml[template.visual]));
          category.textContent = template.category;
          title.textContent = template.name;
          arrow.style.color = template.accent;
          summary.textContent = template.summary;
          bestFor.textContent = `适合：${template.bestFor}`;

            const pill = document.createElement('span');
            pill.className = 'effect';
            pill.textContent = effect;
            effects.appendChild(pill);
          });
          grid.appendChild(node);
        });
      window.inlineEditor?.refresh();
    }

      wrap.innerHTML = html.trim();
      return wrap.firstElementChild;

          '.preview-shell .copy',
          '.preview-shell .discover',
          '.preview-shell .hello',
          '.preview-shell .pill',
          '.preview-shell .chip',
          '.preview-shell .terminal div',
          '.preview-shell .white',
          '.preview-shell .download',
          '.preview-shell .quest',
          '.preview-shell .core',
          '.preview-shell .main',
          '.preview-shell .tile',
          '.preview-shell .top span',
          '.preview-shell .search',
          '.preview-shell .foot span',
          '.preview-shell .cta',
          '.preview-shell .step'
        ].join(','))).filter((node) => !node.closest('.toolbar'));
      }

      bind() {
        if (!this.toggle || !this.hotzone) return;
        this.toggle.addEventListener('click', () => this.toggleEditMode());
        this.hotzone.addEventListener('click', () => this.toggleEditMode());
        this.hotzone.addEventListener('mouseenter', () => this.showToggle());
        this.hotzone.addEventListener('mouseleave', () => this.scheduleHide());
        this.toggle.addEventListener('mouseenter', () => this.showToggle());
        this.toggle.addEventListener('mouseleave', () => this.scheduleHide());
        document.addEventListener('keydown', (event) => {
          if ((event.key === 'e' || event.key === 'E') && (!event.target.getAttribute || event.target.getAttribute('contenteditable') !== 'true')) {
            event.preventDefault();
            this.toggleEditMode();
          }
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
            event.preventDefault();
            this.save();
          }
        });
      }

      refresh() {
        this.data = this.readData();
        this.applyData();
        this.editableNodes().forEach((node) => {
          node.setAttribute('contenteditable', this.isActive ? 'true' : 'false');
          node.setAttribute('spellcheck', 'false');
        });
      }

      showToggle() {
        clearTimeout(this.hideTimeout);
        this.toggle.classList.add('show');
      }

      scheduleHide() {
        this.hideTimeout = setTimeout(() => {
          if (!this.isActive) this.toggle.classList.remove('show');
        }, 420);
      }

      toggleEditMode() {
        this.isActive = !this.isActive;
        document.body.classList.toggle('editing', this.isActive);
        this.toggle.classList.toggle('active', this.isActive);
        this.toggle.textContent = this.isActive ? '编辑中' : '编辑';
        this.refresh();
        if (!this.isActive) this.save();
      }

      save() {
        const data = this.readData();
        this.editableNodes().forEach((node) => {
          data[this.nodeKey(node)] = node.innerHTML;
        });
        localStorage.setItem(this.key, JSON.stringify(data));
        this.data = data;
        this.toggle.textContent = '已保存';
        setTimeout(() => {
          this.toggle.textContent = this.isActive ? '编辑中' : '编辑';
        }, 900);
      }

      applyData() {
        this.editableNodes().forEach((node) => {
          const key = this.nodeKey(node);
          if (this.data[key] !== undefined) node.innerHTML = this.data[key];
        });
      }

      readData() {
        try {
          return JSON.parse(localStorage.getItem(this.key) || '{}');
        } catch (error) {
          localStorage.removeItem(this.key);
          return {};
        }
      }

      nodeKey(node) {
        if (node.dataset.editId) return node.dataset.editId;
        const card = node.closest('.template-card');
        const scope = card ? `card-${card.dataset.templateName || 'template'}` : 'page';
        const role = node.classList[0] || node.tagName.toLowerCase();
        const text = node.textContent.trim().replace(/\s+/g, '').slice(0, 14) || 'text';
        node.dataset.editId = `${scope}-${role}-${this.hash(text)}`.replace(/[^a-zA-Z0-9_-]+/g, '-').toLowerCase();
        return node.dataset.editId;
      }

      hash(text) {
        let value = 0;
        for (const char of text) value = ((value * 31) + char.charCodeAt(0)) >>> 0;
        return value.toString(36);
      }

      pathWithin(root, node) {
        const parts = [];
        let current = node;
        while (current && current !== root) {
          const parent = current.parentElement;
          if (!parent) break;
          const tag = current.tagName.toLowerCase();
          const className = Array.from(current.classList).slice(0, 2).join('.');
          const similar = Array.from(parent.children).filter((child) => child.tagName === current.tagName && child.className === current.className);
          const index = similar.indexOf(current);
          parts.unshift(`${tag}${className ? `.${className}` : ''}:${index}`);
          current = parent;
        }
        return parts.join('>');
      }
    }

    window.inlineEditor = new InlineEditor();
  </script>
</body>
</html>
