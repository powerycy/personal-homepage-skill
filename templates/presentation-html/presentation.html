<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>16:9 HTML Presentation</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --stage-w: 1920;
      --stage-h: 1080;
      --bg: #0b0b0f;
      --ink: #f8f4ec;
      --muted: rgba(248,244,236,.68);
      --accent: #ff6a3d;
      --font-body: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050507; color: var(--ink); font-family: var(--font-body); }
    .viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 80% 10%, rgba(255,106,61,.22), transparent 30%), #050507; }
    .stage-shell { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; }
    .stage { position: absolute; left: 0; top: 0; width: calc(var(--stage-w) * 1px); height: calc(var(--stage-h) * 1px); transform: scale(var(--scale, 1)); transform-origin: left top; overflow: hidden; background: var(--bg); box-shadow: 0 32px 120px rgba(0,0,0,.42); }
    .slide { position: absolute; inset: 0; padding: 92px 104px; visibility: hidden; opacity: 0; pointer-events: none; background: var(--bg); }
    .slide.active { visibility: visible; opacity: 1; pointer-events: auto; }
    .kicker { font-family: var(--font-mono); font-size: 24px; letter-spacing: 0; color: var(--accent); text-transform: uppercase; }
    h1 { margin: 34px 0 0; max-width: 1280px; font-size: 128px; line-height: .95; letter-spacing: 0; text-wrap: balance; }
    h2 { margin: 0; max-width: 1180px; font-size: 88px; line-height: 1.02; letter-spacing: 0; text-wrap: balance; }
    p { margin: 0; color: var(--muted); font-size: 34px; line-height: 1.65; }
    .lead { margin-top: 42px; max-width: 980px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 60px; }
    .card { min-height: 250px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; padding: 34px; background: rgba(255,255,255,.07); }
    .card h3 { margin: 0 0 18px; font-size: 36px; }
    .card p { font-size: 25px; line-height: 1.6; }
    .counter { position: fixed; right: 28px; bottom: 24px; z-index: 10; font-family: var(--font-mono); color: rgba(255,255,255,.6); font-size: 13px; }
    .hint { position: fixed; left: 28px; bottom: 24px; z-index: 10; color: rgba(255,255,255,.45); font-size: 13px; }
    .edit-hotzone { position: fixed; left: 0; top: 0; width: 96px; height: 72px; z-index: 1000; }
    .edit-toggle { position: fixed; left: 18px; top: 16px; z-index: 1001; opacity: 0; transform: translateY(-6px); pointer-events: none; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 13px; background: rgba(12,12,16,.72); color: var(--ink); font: 800 13px/1 var(--font-body); backdrop-filter: blur(12px); cursor: pointer; transition: opacity .18s ease, transform .18s ease; }
    .edit-hotzone:hover + .edit-toggle, .edit-toggle:hover, .edit-toggle:focus-visible, body.editing .edit-toggle { opacity: 1; transform: translateY(0); pointer-events: auto; }
    body.editing [contenteditable="true"] { outline: 2px dashed rgba(255,106,61,.72); outline-offset: 6px; border-radius: 6px; cursor: text; }
    body.editing [contenteditable="true"]:focus { outline: 3px solid rgba(255,106,61,.9); background: rgba(255,106,61,.08); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    @media print { .edit-hotzone, .edit-toggle { display: none !important; } }
  </style>
</head>
<body>
  <div class="edit-hotzone" aria-hidden="true"></div>
  <button class="edit-toggle" type="button" aria-pressed="false">编辑</button>
  <div class="viewport">
    <div class="stage-shell" id="stageShell">
      <main class="stage" id="stage" aria-live="polite">
        <section class="slide active" aria-label="Slide 1" data-slide-id="opening" data-original-number="01" data-slide-title="把项目讲成一套清楚的 16:9 演示">
          <div class="kicker">Project / 2026</div>
          <h1>把项目讲成一套清楚的 16:9 演示</h1>
          <p class="lead">这里放 1-2 句核心说明。长段中文不要做成巨大标题；需要更多信息时拆成下一页。</p>
        </section>
        <section class="slide" aria-label="Slide 2" data-slide-id="one-idea-per-slide" data-original-number="02" data-slide-title="一页只承担一个主要观点">
          <h2>一页只承担一个主要观点</h2>
          <div class="grid">
            <article class="card"><h3>问题</h3><p>用短句说明背景和痛点。</p></article>
            <article class="card"><h3>方案</h3><p>说明你的关键设计或实现。</p></article>
            <article class="card"><h3>结果</h3><p>展示真实结果；没有数据就写待补充。</p></article>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div class="hint">← / → / Space 翻页，F 全屏</div>
  <div class="counter" id="counter">01 / 02</div>
  <script>
    const stage = document.getElementById('stage');
    const stageShell = document.getElementById('stageShell');
    const slides = [...document.querySelectorAll('.slide')];
    const counter = document.getElementById('counter');
    let index = 0;

    function resize() {
      const scale = stageShell.getBoundingClientRect().width / 1920;
      stage.style.setProperty('--scale', String(scale));
    }

    function go(next) {
      index = Math.max(0, Math.min(slides.length - 1, next));
      slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
      counter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      location.hash = `slide-${index + 1}`;
    }

    window.addEventListener('resize', resize);
    document.addEventListener('keydown', (event) => {
      if (event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(event.key)) { event.preventDefault(); go(index + 1); }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); go(index - 1); }
      if (event.key === 'Home') { event.preventDefault(); go(0); }
      if (event.key === 'End') { event.preventDefault(); go(slides.length - 1); }
      if (event.key.toLowerCase() === 'f' && document.fullscreenEnabled) {
        event.preventDefault();
        document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      }
    });

    const match = location.hash.match(/slide-(\d+)/);
    resize();
    if (match) go(Number(match[1]) - 1);

    class InlineEditor {
      constructor() {
        this.key = `presentation-template-edits:${location.pathname}`;
        this.button = document.querySelector('.edit-toggle');
        this.nodes = [];
        this.isActive = false;
        this.load();
        this.bind();
      }

      collect() {
        this.nodes = [...document.querySelectorAll('.slide .kicker, .slide h1, .slide h2, .slide p, .slide h3')];
        const seen = {};
        this.nodes.forEach((node) => {
          if (node.dataset.editId) return;
          const slide = node.closest('.slide');
          const slideId = slide?.dataset.slideId || 'page';
          const role = node.classList[0] || node.tagName.toLowerCase();
          const base = `slide-${slideId}-${role}`.replace(/[^a-zA-Z0-9_-]+/g, '-').toLowerCase();
          const count = seen[base] || 0;
          seen[base] = count + 1;
          node.dataset.editId = count ? `${base}-${count + 1}` : base;
        });
      }

      load() {
        this.collect();
        const saved = this.readData();
        this.nodes.forEach((node) => {
          if (typeof saved[node.dataset.editId] === 'string') node.innerHTML = saved[node.dataset.editId];
        });
      }

      save() {
        const data = {};
        this.nodes.forEach((node) => { data[node.dataset.editId] = node.innerHTML; });
        localStorage.setItem(this.key, JSON.stringify(data));
        this.button.textContent = '已保存';
        window.setTimeout(() => { this.button.textContent = this.isActive ? '编辑中' : '编辑'; }, 900);
      }

      readData() {
        try {
          const data = JSON.parse(localStorage.getItem(this.key) || '{}');
          return data && !Array.isArray(data) ? data : {};
        } catch (error) {
          localStorage.removeItem(this.key);
          return {};
        }
      }

      setActive(active) {
        this.isActive = active;
        document.body.classList.toggle('editing', active);
        this.button.setAttribute('aria-pressed', String(active));
        this.button.textContent = active ? '编辑中' : '编辑';
        this.nodes.forEach((node) => {
          node.setAttribute('contenteditable', active ? 'true' : 'false');
          node.setAttribute('spellcheck', 'false');
        });
        if (!active) this.save();
      }

      bind() {
        this.button.addEventListener('click', () => this.setActive(!this.isActive));
        this.nodes.forEach((node) => node.addEventListener('input', () => this.save()));
        document.addEventListener('keydown', (event) => {
          const typingContext = event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]');
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
            event.preventDefault();
            this.save();
          } else if (!typingContext && event.key.toLowerCase() === 'e') {
            event.preventDefault();
            this.setActive(!this.isActive);
          } else if (event.key === 'Escape' && this.isActive) {
            event.preventDefault();
            this.setActive(false);
          }
        });
      }
    }

    new InlineEditor();
  </script>
</body>
</html>
