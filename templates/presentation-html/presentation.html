<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>16:9 HTML Presentation</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      --stage-w: 1920;
      --stage-h: 1080;
      --bg: #0b0b0f;
      --ink: #f8f4ec;
      --muted: rgba(248,244,236,.68);
      --accent: #ff6a3d;
      --font-body: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050507; color: var(--ink); font-family: var(--font-body); }
    .viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 80% 10%, rgba(255,106,61,.22), transparent 30%), #050507; }
    .stage-shell { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; }
    .stage { position: absolute; left: 0; top: 0; width: calc(var(--stage-w) * 1px); height: calc(var(--stage-h) * 1px); transform: scale(var(--scale, 1)); transform-origin: left top; overflow: hidden; background: var(--bg); box-shadow: 0 32px 120px rgba(0,0,0,.42); }
    .slide { position: absolute; inset: 0; padding: 92px 104px; visibility: hidden; opacity: 0; pointer-events: none; background: var(--bg); }
    .slide.active { visibility: visible; opacity: 1; pointer-events: auto; }
    .kicker { font-family: var(--font-mono); font-size: 24px; letter-spacing: 0; color: var(--accent); text-transform: uppercase; }
    h1 { margin: 34px 0 0; max-width: 1280px; font-size: 128px; line-height: .95; letter-spacing: 0; text-wrap: balance; }
    h2 { margin: 0; max-width: 1180px; font-size: 88px; line-height: 1.02; letter-spacing: 0; text-wrap: balance; }
    p { margin: 0; color: var(--muted); font-size: 34px; line-height: 1.65; }
    .lead { margin-top: 42px; max-width: 980px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 60px; }
    .card { min-height: 250px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; padding: 34px; background: rgba(255,255,255,.07); }
    .card h3 { margin: 0 0 18px; font-size: 36px; }
    .card p { font-size: 25px; line-height: 1.6; }
    .counter { position: fixed; right: 28px; bottom: 24px; z-index: 10; font-family: var(--font-mono); color: rgba(255,255,255,.6); font-size: 13px; }
    .hint { position: fixed; left: 28px; bottom: 24px; z-index: 10; color: rgba(255,255,255,.45); font-size: 13px; }
    .edit-hotzone { position: fixed; left: 0; top: 0; width: 96px; height: 72px; z-index: 1000; }
    .edit-controls { position: fixed; left: 18px; top: 16px; z-index: 1001; display: flex; gap: 8px; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
    .edit-hotzone:hover ~ .edit-controls, .edit-controls:hover, .edit-controls:focus-within, body.editing .edit-controls { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .edit-toggle, .edit-action { border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 13px; background: rgba(12,12,16,.72); color: var(--ink); font: 800 13px/1 var(--font-body); backdrop-filter: blur(12px); cursor: pointer; }
    .edit-action { font-weight: 600; color: var(--muted); }
    body.editing [contenteditable="true"] { outline: 2px dashed rgba(255,106,61,.72); outline-offset: 6px; border-radius: 6px; cursor: text; }
    body.editing [contenteditable="true"]:focus { outline: 3px solid rgba(255,106,61,.9); background: rgba(255,106,61,.08); }
    .edit-attr-panel { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1003; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; background: rgba(12,12,16,.9); color: var(--ink); font: 600 13px/1.2 var(--font-body); backdrop-filter: blur(14px); box-shadow: 0 18px 48px rgba(0,0,0,.4); }
    .edit-attr-panel input { min-width: 260px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(255,255,255,.06); color: var(--ink); font: 500 13px/1.2 var(--font-body); }
    .edit-attr-panel button { border: none; border-radius: 999px; padding: 8px 12px; background: var(--accent); color: #111; font: 800 12px/1 var(--font-body); cursor: pointer; }
    .edit-attr-panel .cancel { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,.2); }
    @media (hover: none) { .edit-controls { opacity: .92; transform: none; pointer-events: auto; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    @media print { .edit-hotzone, .edit-controls { display: none !important; } }
  </style>
</head>
<body>
  <div class="edit-hotzone" aria-hidden="true"></div>
  <div class="edit-controls">
    <button class="edit-toggle" type="button" data-editor-control="toggle" aria-pressed="false">编辑</button>
    <button class="edit-action" type="button" data-editor-control="reset">恢复初始</button>
    <button class="edit-action" type="button" data-editor-control="export" id="exportHtml">导出 HTML</button>
  </div>
  <div class="viewport">
    <div class="stage-shell" id="stageShell">
      <main class="stage" id="stage" aria-live="polite">
        <section class="slide active" aria-label="Slide 1" data-slide-id="opening" data-original-number="01" data-slide-title="把项目讲成一套清楚的 16:9 演示">
          <div class="kicker">Project / 2026</div>
          <h1>把项目讲成一套清楚的 16:9 演示</h1>
          <p class="lead" data-placeholder="true">这里放 1-2 句核心说明。长段中文不要做成巨大标题；需要更多信息时拆成下一页。</p>
        </section>
        <section class="slide" aria-label="Slide 2" data-slide-id="one-idea-per-slide" data-original-number="02" data-slide-title="一页只承担一个主要观点">
          <h2>一页只承担一个主要观点</h2>
          <div class="grid">
            <article class="card"><h3>问题</h3><p data-placeholder="true">用短句说明背景和痛点。</p></article>
            <article class="card"><h3>方案</h3><p data-placeholder="true">说明你的关键设计或实现。</p></article>
            <article class="card"><h3>结果</h3><p data-placeholder="true">展示真实结果；没有数据就写待补充。</p></article>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div class="hint">← / -> / Space 翻页，F 全屏</div>
  <div class="counter" id="counter">01 / 02</div>
  <script>
    const stage = document.getElementById('stage');
    const stageShell = document.getElementById('stageShell');
    const slides = [...document.querySelectorAll('.slide')];
    const counter = document.getElementById('counter');
    let index = 0;

    function resize() {
      const scale = stageShell.getBoundingClientRect().width / 1920;
      stage.style.setProperty('--scale', String(scale));
    }

    function go(next) {
      index = Math.max(0, Math.min(slides.length - 1, next));
      slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
      counter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      location.hash = `slide-${index + 1}`;
    }

    window.addEventListener('resize', resize);
    document.addEventListener('keydown', (event) => {
      if (event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(event.key)) { event.preventDefault(); go(index + 1); }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); go(index - 1); }
      if (event.key === 'Home') { event.preventDefault(); go(0); }
      if (event.key === 'End') { event.preventDefault(); go(slides.length - 1); }
      if (event.key.toLowerCase() === 'f' && document.fullscreenEnabled) {
        event.preventDefault();
        document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      }
    });

    const match = location.hash.match(/slide-(\d+)/);
    resize();
    if (match) go(Number(match[1]) - 1);
  </script>
  <script>
    class InlineEditor {
      constructor(options) {
        const settings = Object.assign({
          selector: '',
          exclude: '',
          attrSelector: '',
          storagePrefix: 'page',
          downloadName: 'page-edited.html',
          scopePrefix: ''
        }, options || {});

        this.settings = settings;
        this.texts = this.resolveTexts();
        this.isActive = false;
        this.baseKey = `${settings.storagePrefix}-edits:${location.pathname}`;
        const version = document.documentElement.dataset.editVersion || '';
        this.versionKey = version ? `${this.baseKey}:${version}` : '';
        this.toggle = document.querySelector('.edit-toggle');
        this.hotzone = document.querySelector('.edit-hotzone');
        this.exportButton = document.querySelector('[data-editor-control="export"]');
        this.resetButton = document.querySelector('[data-editor-control="reset"]');
        this.panel = null;
        this.nodes = [];
        this.attrNodes = [];

        this.collect();
        this.backupOriginals();
        this.loadEdits();
        this.bindEvents();
      }

      resolveTexts() {
        const zh = {
          edit: '编辑', editing: '编辑中', saved: '已保存', export: '导出 HTML', reset: '恢复初始',
          resetConfirm: '把所有可编辑文案恢复为初始内容？当前修改将被清除。',
          placeholderWarning: (count) => `还有 ${count} 处占位文案未修改，仍要导出吗？`,
          linkLabel: '链接地址', imageLabel: '图片地址', save: '保存', cancel: '取消',
          resourceBanner: '部分样式或图片资源未能加载，页面可能与预期不同。'
        };
        const en = {
          edit: 'Edit', editing: 'Editing', saved: 'Saved', export: 'Export HTML', reset: 'Reset',
          resetConfirm: 'Restore all editable text to its initial content? Current edits will be discarded.',
          placeholderWarning: (count) => `${count} placeholder texts are still unedited. Export anyway?`,
          linkLabel: 'Link URL', imageLabel: 'Image URL', save: 'Save', cancel: 'Cancel',
          resourceBanner: 'Some styles or images failed to load; the page may look different.'
        };
        return /^zh/i.test(document.documentElement.lang || 'zh') ? zh : en;
      }

      collect() {
        this.nodes = Array.from(document.querySelectorAll(this.settings.selector))
          .filter((node) => !node.closest('[data-editor-chrome]'))
          .filter((node) => !this.settings.exclude || !node.closest(this.settings.exclude));
        const seen = Object.create(null);
        this.nodes.forEach((node) => {
          if (!node.dataset.editId) node.dataset.editId = this.deriveId(node, seen, '');
        });
        if (this.settings.attrSelector) {
          this.attrNodes = Array.from(document.querySelectorAll(this.settings.attrSelector))
            .filter((node) => !node.closest('[data-editor-chrome]'));
          const seenAttr = Object.create(null);
          this.attrNodes.forEach((node) => {
            if (!node.dataset.editId) node.dataset.editId = this.deriveId(node, seenAttr, 'attr-');
          });
        }
      }

      deriveId(node, seen, kindPrefix) {
        const scopeEl = node.closest('[data-slide-id]') || node.closest('section[id]') || node.closest('section');
        const rawScope = (scopeEl && (scopeEl.dataset.slideId || scopeEl.id || scopeEl.classList[0] || '')) || 'page';
        const role = node.classList[0] || node.tagName.toLowerCase();
        const base = `${this.settings.scopePrefix}${kindPrefix}${rawScope}-${role}`.replace(/[^a-zA-Z0-9_-]+/g, '-').toLowerCase();
        const count = seen[base] || 0;
        seen[base] = count + 1;
        return count ? `${base}-${count + 1}` : base;
      }

      attrKey(node, attribute) {
        return `@attr:${node.dataset.editId}:${attribute}`;
      }

      readStorage(key) {
        try {
          const data = JSON.parse(localStorage.getItem(key) || '{}');
          return data && !Array.isArray(data) ? data : {};
        } catch (error) {
          localStorage.removeItem(key);
          return {};
        }
      }

      backupOriginals() {
        const originalKey = `${this.baseKey}:original`;
        if (localStorage.getItem(originalKey) !== null) return;
        const snapshot = {};
        this.nodes.forEach((node) => { snapshot[node.dataset.editId] = node.innerHTML; });
        this.attrNodes.forEach((node) => {
          ['href', 'src', 'alt'].forEach((name) => {
            if (node.hasAttribute(name)) snapshot[this.attrKey(node, name)] = node.getAttribute(name);
          });
        });
        try { localStorage.setItem(originalKey, JSON.stringify(snapshot)); } catch (error) { /* storage unavailable */ }
      }

      loadEdits() {
        const saved = Object.assign(
          {},
          this.readStorage(this.baseKey),
          this.readStorage(this.versionKey),
          (window.__EXPORTED_EDITS__ && typeof window.__EXPORTED_EDITS__ === 'object') ? window.__EXPORTED_EDITS__ : {}
        );
        this.nodes.forEach((node) => {
          const value = saved[node.dataset.editId];
          if (typeof value === 'string') node.innerHTML = value;
        });
        this.attrNodes.forEach((node) => {
          ['href', 'src', 'alt'].forEach((name) => {
            const value = saved[this.attrKey(node, name)];
            if (typeof value === 'string') node.setAttribute(name, value);
          });
        });
      }

      save(showLabel) {
        const data = {};
        this.nodes.forEach((node) => { data[node.dataset.editId] = this.sanitize(node.innerHTML); });
        this.attrNodes.forEach((node) => {
          ['href', 'src', 'alt'].forEach((name) => {
            if (node.hasAttribute(name)) data[this.attrKey(node, name)] = node.getAttribute(name);
          });
        });
        try { localStorage.setItem(this.versionKey || this.baseKey, JSON.stringify(data)); } catch (error) { /* storage unavailable */ }
        if (showLabel !== false) this.flashSaved();
        return data;
      }

      flashSaved() {
        if (!this.toggle) return;
        this.toggle.textContent = this.texts.saved;
        window.setTimeout(() => {
          this.toggle.textContent = this.isActive ? this.texts.editing : this.texts.edit;
        }, 900);
      }

      setActive(active) {
        this.isActive = active;
        document.body.classList.toggle('editing', active);
        if (this.toggle) {
          this.toggle.setAttribute('aria-pressed', String(active));
          this.toggle.textContent = active ? this.texts.editing : this.texts.edit;
        }
        this.nodes.forEach((node) => {
          node.setAttribute('contenteditable', active ? 'true' : 'false');
          node.setAttribute('spellcheck', 'false');
        });
        if (!active) {
          this.save();
          this.closePanel();
        }
      }

      bindEvents() {
        if (this.toggle) this.toggle.addEventListener('click', () => this.setActive(!this.isActive));
        if (this.hotzone) this.hotzone.addEventListener('click', () => this.setActive(!this.isActive));
        if (this.exportButton) this.exportButton.addEventListener('click', () => this.exportHtml());
        if (this.resetButton) this.resetButton.addEventListener('click', () => this.resetAll());
        document.addEventListener('input', (event) => {
          if (!this.isActive) return;
          if (event.target.closest && event.target.closest('[contenteditable="true"]')) this.save(false);
        });
        document.addEventListener('paste', (event) => this.handlePaste(event), true);
        document.addEventListener('drop', (event) => this.handleDrop(event), true);
        document.addEventListener('keydown', (event) => this.handleKeydown(event));
        document.addEventListener('click', (event) => this.handleAttrClick(event), true);
        window.addEventListener('beforeunload', () => { if (this.isActive) this.save(false); });
      }

      handleKeydown(event) {
        const inField = event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]');
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault();
          this.save();
          return;
        }
        if (event.key === 'Escape') {
          if (this.panel) { event.preventDefault(); this.closePanel(); return; }
          if (this.isActive && !event.isComposing) { event.preventDefault(); this.setActive(false); }
          return;
        }
        if (!inField && !event.metaKey && !event.ctrlKey && !event.altKey && event.key.toLowerCase() === 'e') {
          event.preventDefault();
          this.setActive(!this.isActive);
          return;
        }
        if (this.isActive && event.key === 'Enter') this.handleEnter(event);
      }

      handleEnter(event) {
        const node = event.target.closest && event.target.closest('[contenteditable="true"]');
        if (!node) return;
        event.preventDefault();
        // Insert <br> instead of letting the browser split the element, so headings keep their layout.
        if (/^(P|LI|BLOCKQUOTE|TD|TH|DIV)$/.test(node.tagName)) document.execCommand('insertLineBreak');
      }

      handlePaste(event) {
        if (!this.isActive) return;
        const node = event.target.closest && event.target.closest('[contenteditable="true"]');
        if (!node) return;
        event.preventDefault();
        const html = event.clipboardData ? event.clipboardData.getData('text/html') : '';
        const plain = event.clipboardData ? event.clipboardData.getData('text/plain') : '';
        if (html) {
          document.execCommand('insertHTML', false, this.sanitize(html));
        } else if (plain) {
          document.execCommand('insertText', false, plain);
        }
      }

      handleDrop(event) {
        if (!this.isActive) return;
        const node = event.target.closest && event.target.closest('[contenteditable="true"]');
        if (!node) return;
        event.preventDefault();
        const html = event.dataTransfer ? event.dataTransfer.getData('text/html') : '';
        const plain = event.dataTransfer ? event.dataTransfer.getData('text/plain') : '';
        if (html) {
          document.execCommand('insertHTML', false, this.sanitize(html));
        } else if (plain) {
          document.execCommand('insertText', false, plain);
        }
      }

      // Whitelist sanitizer: keeps basic inline formatting, unwraps everything else,
      // and strips every attribute except safe href values. Prevents pasted markup
      // (Word, web pages, editors) and script-carrying payloads from breaking the page.
      sanitize(html) {
        const ALLOWED = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'A', 'SPAN']);
        const SAFE_URL = /^(https?:|mailto:)/i;
        const root = document.createElement('div');
        root.innerHTML = html;
        const clean = (element) => {
          Array.from(element.children).forEach(clean);
          if (!ALLOWED.has(element.tagName)) {
            element.replaceWith(...Array.from(element.childNodes));
            return;
          }
          if (element.tagName === 'A') {
            const href = element.getAttribute('href') || '';
            if (!SAFE_URL.test(href)) {
              element.replaceWith(...Array.from(element.childNodes));
              return;
            }
            const safe = document.createElement('a');
            safe.setAttribute('href', href);
            safe.append(...Array.from(element.childNodes));
            element.replaceWith(safe);
            return;
          }
          while (element.attributes.length) element.removeAttribute(element.attributes[0].name);
        };
        Array.from(root.children).forEach(clean);
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_COMMENT);
        const comments = [];
        while (walker.nextNode()) comments.push(walker.currentNode);
        comments.forEach((comment) => comment.remove());
        return root.innerHTML;
      }

      handleAttrClick(event) {
        if (!this.isActive) return;
        if (event.target.closest && event.target.closest('.edit-controls, .edit-attr-panel')) return;
        const target = event.target.closest && event.target.closest('a[data-edit-id], img[data-edit-id]');
        if (!target) return;
        event.preventDefault();
        event.stopPropagation();
        this.openPanel(target);
      }

      openPanel(target) {
        this.closePanel();
        const isImage = target.tagName === 'IMG';
        const attribute = isImage ? 'src' : 'href';
        const panel = document.createElement('div');
        panel.className = 'edit-attr-panel';
        panel.setAttribute('data-editor-chrome', '');
        const label = document.createElement('label');
        label.textContent = isImage ? this.texts.imageLabel : this.texts.linkLabel;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = target.getAttribute(attribute) || '';
        const apply = document.createElement('button');
        apply.type = 'button';
        apply.textContent = this.texts.save;
        const cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'cancel';
        cancel.textContent = this.texts.cancel;
        panel.append(label, input, apply, cancel);
        document.body.appendChild(panel);
        input.focus();
        input.select();
        this.panel = { panel, target, attribute, apply };

        apply.addEventListener('click', () => {
          target.setAttribute(attribute, input.value.trim());
          this.save(false);
          this.closePanel();
        });
        cancel.addEventListener('click', () => this.closePanel());
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') { event.preventDefault(); apply.click(); }
          if (event.key === 'Escape') { event.preventDefault(); this.closePanel(); }
        });
      }

      closePanel() {
        if (this.panel) { this.panel.panel.remove(); this.panel = null; }
      }

      resetAll() {
        if (!window.confirm(this.texts.resetConfirm)) return;
        const original = this.readStorage(`${this.baseKey}:original`);
        this.nodes.forEach((node) => {
          const value = original[node.dataset.editId];
          if (typeof value === 'string') node.innerHTML = value;
        });
        this.attrNodes.forEach((node) => {
          ['href', 'src', 'alt'].forEach((name) => {
            const key = this.attrKey(node, name);
            if (typeof original[key] === 'string') node.setAttribute(name, original[key]);
            else if (node.hasAttribute(name)) node.removeAttribute(name);
          });
        });
        localStorage.removeItem(this.baseKey);
        if (this.versionKey) localStorage.removeItem(this.versionKey);
        this.flashSaved();
      }

      pendingPlaceholderCount() {
        const original = this.readStorage(`${this.baseKey}:original`);
        return this.nodes.filter((node) => (
          node.dataset.placeholder === 'true' && node.innerHTML === original[node.dataset.editId]
        )).length;
      }

      exportHtml() {
        const edits = this.save(false);
        const pending = this.pendingPlaceholderCount();
        if (pending > 0 && !window.confirm(this.texts.placeholderWarning(pending))) return;

        const clone = document.documentElement.cloneNode(true);
        const body = clone.querySelector('body');
        body.classList.remove('editing');
        clone.removeAttribute('data-edit-version');
        clone.setAttribute('data-edit-version', `export-${Date.now()}`);
        clone.querySelectorAll('[contenteditable]').forEach((node) => node.setAttribute('contenteditable', 'false'));
        clone.querySelectorAll('[data-editor-chrome], #exported-edits').forEach((node) => node.remove());

        // Embed the edit snapshot so the exported file renders identically anywhere,
        // even where localStorage is empty or stale.
        const payload = JSON.stringify(edits).replace(/</g, '\\u003c');
        const embed = document.createElement('script');
        embed.id = 'exported-edits';
        embed.textContent = `window.__EXPORTED_EDITS__=${payload}`;
        body.appendChild(embed);

        const banner = document.createElement('script');
        banner.textContent = this.resourceBannerScript();
        body.appendChild(banner);

        const blob = new Blob([`<!doctype html>\n${clone.outerHTML}`], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = this.settings.downloadName;
        anchor.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      resourceBannerScript() {
        const message = this.texts.resourceBanner.replace(/'/g, "\\'");
        return `(function(){var shown=false;window.addEventListener('error',function(event){var t=event.target;if(!t||!t.tagName)return;if(t.tagName==='LINK'||t.tagName==='IMG'||t.tagName==='SCRIPT'){if(shown)return;shown=true;var b=document.createElement('div');b.setAttribute('data-editor-chrome','');b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#b45309;color:#fff;font:600 13px/1.5 system-ui,sans-serif;padding:9px 16px;text-align:center;pointer-events:none;';b.textContent='${message}';(document.body||document.documentElement).appendChild(b);}},true);})();`;
      }
    }

    new InlineEditor({
      selector: '.slide .kicker, .slide h1, .slide h2, .slide p, .slide h3',
      attrSelector: '.slide a[href^="http"], .slide a[href^="mailto:"], .slide img[src]',
      storagePrefix: 'presentation-template',
      downloadName: 'presentation-edited.html',
      scopePrefix: 'slide-'
    });
  </script>
</body>
</html>
