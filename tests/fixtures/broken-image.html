<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}.viewport{position:fixed;inset:0;display:grid;place-items:center}.stage-shell{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(var(--scale));transform-origin:left top}.slide{position:absolute;inset:0;visibility:hidden;opacity:0;background:#111}.slide.active{visibility:visible;opacity:1}
</style></head><body><div class="viewport"><div class="stage-shell"><main class="stage"><section class="slide active" data-slide-id="broken" data-original-number="01" data-slide-title="损坏素材"><img src="./does-not-exist.png" alt="损坏素材"></section></main></div></div><div class="counter">01 / 01</div><script>const shell=document.querySelector('.stage-shell'),stage=document.querySelector('.stage');function resize(){stage.style.setProperty('--scale',shell.getBoundingClientRect().width/1920)}addEventListener('resize',resize);resize();</script></body></html>
