<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}.viewport{position:fixed;inset:0;display:grid;place-items:center}.stage-shell{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(var(--scale));transform-origin:left top}.slide{position:absolute;inset:0;visibility:hidden;opacity:0;background:#111}.slide.active{visibility:visible;opacity:1}
</style></head><body><div class="viewport"><div class="stage-shell"><main class="stage"><section class="slide active" data-slide-id="a" data-original-number="01" data-slide-title="A">A</section><section class="slide" data-slide-id="b" data-original-number="02" data-slide-title="B">B</section></main></div></div><div class="counter">01 / 02</div><script>
const shell=document.querySelector('.stage-shell'),stage=document.querySelector('.stage'),slides=[...document.querySelectorAll('.slide')];let index=0;function go(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===index))}function resize(){stage.style.setProperty('--scale',shell.getBoundingClientRect().width/1920)}addEventListener('resize',resize);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});resize();
</script></body></html>
